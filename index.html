<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>Il mio allenamento</title>
  <link rel="stylesheet" href="assets/styles.css?v=10" />
</head>
<body class="auth-entry">
  <header class="app-header">
    <div>
      <p class="eyebrow">La tua scheda, i tuoi progressi</p>
      <h1>Il mio allenamento</h1>
    </div>
  </header>

  <main>
    <p id="account-status" class="social-status app-status" role="status" hidden></p>
    <div id="loading" class="loading" role="status">Caricamento dell'app...</div>
    <section id="workout-app" aria-live="polite"></section>
  </main>

  <nav class="app-nav" aria-label="Sezioni dell'allenamento" hidden>
    <button type="button" data-view="plan">
      <span aria-hidden="true">▦</span>
      Piano
    </button>
    <button type="button" data-view="workout">
      <span aria-hidden="true">▶</span>
      Allenamento
    </button>
    <button type="button" data-view="profile">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="7" r="4" />
        <path d="M4 22v-3a8 8 0 0 1 16 0v3" />
      </svg>
      Profilo
    </button>
  </nav>

  <script src="assets/state.js"></script>
  <script src="assets/plan-validation.js"></script>
  <script src="assets/social-config.js"></script>
  <script src="assets/attendance.js"></script>
  <script src="assets/social.js"></script>
  <script src="assets/plan.js"></script>
  <script src="assets/workout-library.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/tab-plan.js"></script>
  <script src="assets/plan-editor.js"></script>
  <script src="assets/tab-day.js"></script>
  <script src="assets/manual-workouts.js"></script>
  <script src="assets/tab-workout.js"></script>
  <script src="assets/tab-leaderboard.js"></script>
  <script src="assets/tab-progress.js"></script>
  <script src="assets/tab-profile.js"></script>
  <script src="assets/auth-entry.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
