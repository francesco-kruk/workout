<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1512" />
  <title>Il mio allenamento</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">Scheda di Francesco</p>
      <h1>Il mio allenamento</h1>
    </div>
  </header>

  <main>
    <div id="loading" class="loading">Caricamento del piano...</div>
    <section id="workout-app" aria-live="polite"></section>
  </main>

  <nav class="app-nav" aria-label="Sezioni dell'allenamento">
    <button type="button" data-view="plan">
      <span aria-hidden="true">▦</span>
      Piano
    </button>
    <button type="button" data-view="workout">
      <span aria-hidden="true">▶</span>
      Allenamento
    </button>
    <button type="button" data-view="day">
      <span aria-hidden="true">◫</span>
      Giorno
    </button>
  </nav>

  <script src="assets/state.js"></script>
  <script src="assets/plan.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/tab-plan.js"></script>
  <script src="assets/tab-day.js"></script>
  <script src="assets/tab-workout.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
